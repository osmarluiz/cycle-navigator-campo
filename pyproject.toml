[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cycle-navigator"
version = "0.1.0"
description = "Navigate cropping systems as a label-free continuum: query the landscape by curve shape and recolour it along any phenometric axis, live and region-wide."
authors = [{ name = "Osmar L. F. de Carvalho", email = "osmarlfcarvalho@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cropping intensity", "phenology", "continuum", "satellite image time series", "interactive"]

# ⚠️⚠️ O MOTOR NAO MORA AQUI, E ISSO E' UMA GARANTIA DA FERRAMENTA.
# O que o usuario arrasta nesta ferramenta tem de ser o mesmo codigo que produziu os numeros que ele
# reporta. Essa afirmacao so' e' verdadeira enquanto o motor fenometrico (`pheno_engine`)
# vier daqui, como DEPENDENCIA. No dia em que alguem copiar `pheno.py` para dentro deste repositorio
# "para simplificar", a afirmacao vira falsa em silencio, e ninguem teria como notar.
# `tests/test_motor_compartilhado.py` falha se isso acontecer.
#
# ⚠️ SAO DUAS DEPENDENCIAS DE CODIGO NOSSO, e elas fazem coisas diferentes. `pheno-engine` e' o motor,
# 200 linhas de numpy, e e' dele que sai todo eixo lido. `ts-annotator` entra pelos widgets Qt
# e pelo I/O de raster (RasterSource, TimeSeriesSource, render, TiledMapView, CycleInspectWindow).
# ⚠️ LACUNA CONHECIDA (atualizada): a janela usada aqui e' `ui/continuum_window.ContinuumWindow`.
# `ui/cycle_inspect_window.py`, que uma versao anterior deste arquivo importava, NAO existe em ref
# nenhum do ts-annotator -- era um rename planejado que nunca aconteceu, e o import quebrava sempre.
# Trocado pelo widget que existe de fato.
# ⚠️ O QUE AINDA FALTA: `continuum_window.py` tambem nao esta' no `main` PUBLICO. O clone de trabalho
# esta' 136 commits a' frente do origin/main, e esses commits nunca foram empurrados. Logo
# `pip install` deste pyproject puxa um ts-annotator SEM a janela, e a ferramenta so' abre para quem
# tem o clone local. Isto se resolve empurrando o ts-annotator, nao copiando o widget para ca'.
dependencies = [
    "pheno-engine @ git+https://github.com/osmarluiz/pheno-engine.git@v0.1.0",
    "ts-annotator @ git+https://github.com/osmarluiz/ts-annotator.git@main",
    "numpy>=1.24",
    "rasterio>=1.3",
    "PyQt6>=6.4",
]

[project.optional-dependencies]
pivots = ["geopandas>=0.13"]   # sobreposicao do cadastro de pivos: util, nao obrigatorio
dev = ["pytest>=7"]

[project.scripts]
cycle-navigator = "cycle_navigator.app:main"

[project.urls]
Homepage = "https://github.com/osmarluiz/cycle-navigator"
Engine = "https://github.com/osmarluiz/pheno-engine"
Annotator = "https://github.com/osmarluiz/ts-annotator"

[tool.setuptools.packages.find]
where = ["src"]
