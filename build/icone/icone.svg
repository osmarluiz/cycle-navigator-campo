<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icone do Cycle Navigator: o ano-safra de um talhao como a ferramenta o mostra.
       Curva de NDVI (verde de acao da interface) com dois ciclos, cada faixa na cor da classe
       (Soja e Milho safrinha, config.py), a borda entre elas, e as 12 marcas mensais (out->set).
       Grade da Apple: corpo de 824 px centrado no quadro de 1024.
       Fonte unica: build/icone/gera_icones.py gera .icns, .ico e PNG a partir daqui.
       ⚠️ SEM clipPath: o QtSvg (SVG Tiny) ignora recorte, e o gerador renderiza com ele. Cada faixa
       e' uma area propria; o vale da curva cai no ponto de junta das duas Beziers (570, 610). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3524"/>
      <stop offset="1" stop-color="#121410"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fundo)"/>

  <!-- as duas faixas: soja (ciclo principal) e milho safrinha -->
  <path fill="#f67825" fill-opacity="0.85"
        d="M 170 700 C 260 700 290 290 400 290 C 500 290 520 610 570 610 L 570 700 Z"/>
  <path fill="#c9a227" fill-opacity="0.85"
        d="M 570 610 C 620 610 650 420 720 420 C 800 420 820 700 870 700 L 570 700 Z"/>

  <!-- a borda entre as faixas (gruda no mes) -->
  <line x1="570" y1="232" x2="570" y2="700" stroke="#ecebe0" stroke-opacity="0.45" stroke-width="8"/>

  <!-- linha de base e as 12 marcas mensais -->
  <line x1="170" y1="744" x2="854" y2="744" stroke="#454c36" stroke-width="10" stroke-linecap="round"/>
  <g fill="#767a6c">
    <circle cx="170" cy="792" r="13"/><circle cx="232" cy="792" r="13"/>
    <circle cx="294" cy="792" r="13"/><circle cx="356" cy="792" r="13"/>
    <circle cx="419" cy="792" r="13"/><circle cx="481" cy="792" r="13"/>
    <circle cx="543" cy="792" r="13"/><circle cx="605" cy="792" r="13"/>
    <circle cx="668" cy="792" r="13"/><circle cx="730" cy="792" r="13"/>
    <circle cx="792" cy="792" r="13"/><circle cx="854" cy="792" r="13"/>
  </g>

  <!-- a curva NDVI -->
  <path fill="none" stroke="#8fc452" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"
        d="M 170 700 C 260 700 290 290 400 290 C 500 290 520 610 570 610
           C 620 610 650 420 720 420 C 800 420 820 700 870 700"/>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#brilho)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
</svg>
